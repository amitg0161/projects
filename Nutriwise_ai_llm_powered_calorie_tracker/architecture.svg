<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">NutriWise AI system architecture</title>
  <desc id="desc">A flow diagram showing a user entering a meal in Gradio, parsing, local food lookup, USDA lookup, LLM fallback providers, normalization, placeholder fallback, and JSON storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 28px Georgia, serif; fill: #172033; }
      .subtitle { font: 15px Arial, sans-serif; fill: #526075; }
      .label { font: 700 16px Arial, sans-serif; fill: #172033; }
      .small { font: 13px Arial, sans-serif; fill: #526075; }
      .box { stroke: #334155; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .input { fill: #dbeafe; }
      .logic { fill: #dcfce7; }
      .provider { fill: #fef3c7; }
      .output { fill: #fce7f3; }
      .fallback { fill: #fee2e2; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect class="canvas" width="1200" height="760"/>
  <text class="title" x="600" y="48" text-anchor="middle">NutriWise AI - Local-First Nutrition Pipeline</text>
  <text class="subtitle" x="600" y="76" text-anchor="middle">Every route returns one normalized NutritionEstimate record</text>

  <rect class="box input" x="45" y="305" width="180" height="82"/>
  <text class="label" x="135" y="337" text-anchor="middle">User</text>
  <text class="small" x="135" y="362" text-anchor="middle">Natural-language meal</text>

  <rect class="box input" x="275" y="305" width="190" height="82"/>
  <text class="label" x="370" y="337" text-anchor="middle">Gradio UI</text>
  <text class="small" x="370" y="362" text-anchor="middle">Estimate / Save / Delete</text>

  <rect class="box logic" x="515" y="305" width="190" height="82"/>
  <text class="label" x="610" y="337" text-anchor="middle">Meal Parser</text>
  <text class="small" x="610" y="362" text-anchor="middle">FoodItem + portion</text>

  <rect class="box logic" x="755" y="150" width="190" height="82"/>
  <text class="label" x="850" y="182" text-anchor="middle">Local Food Table</text>
  <text class="small" x="850" y="207" text-anchor="middle">Common home meals</text>

  <rect class="box provider" x="755" y="280" width="190" height="82"/>
  <text class="label" x="850" y="312" text-anchor="middle">USDA API</text>
  <text class="small" x="850" y="337" text-anchor="middle">Optional API key</text>

  <rect class="box provider" x="755" y="410" width="190" height="110"/>
  <text class="label" x="850" y="442" text-anchor="middle">LLM Fallback</text>
  <text class="small" x="850" y="467" text-anchor="middle">Gemini -> OpenAI</text>
  <text class="small" x="850" y="489" text-anchor="middle">-> Ollama</text>

  <rect class="box output" x="995" y="305" width="160" height="82"/>
  <text class="label" x="1075" y="337" text-anchor="middle">Pydantic</text>
  <text class="small" x="1075" y="362" text-anchor="middle">Normalized result</text>

  <rect class="box fallback" x="995" y="470" width="160" height="82"/>
  <text class="label" x="1075" y="502" text-anchor="middle">Placeholder</text>
  <text class="small" x="1075" y="527" text-anchor="middle">Low-confidence result</text>

  <rect class="box output" x="515" y="585" width="190" height="82"/>
  <text class="label" x="610" y="617" text-anchor="middle">JSON Storage</text>
  <text class="small" x="610" y="642" text-anchor="middle">data/meals.json</text>

  <rect class="box output" x="755" y="585" width="190" height="82"/>
  <text class="label" x="850" y="617" text-anchor="middle">Daily Summary</text>
  <text class="small" x="850" y="642" text-anchor="middle">Today's meals + kcal</text>

  <path class="arrow" d="M225 346 H275"/>
  <path class="arrow" d="M465 346 H515"/>
  <path class="arrow" d="M705 330 C730 280 730 205 755 191"/>
  <path class="arrow" d="M705 346 H755"/>
  <path class="arrow" d="M705 365 C730 420 730 455 755 465"/>
  <path class="arrow" d="M945 191 C970 220 970 325 995 338"/>
  <path class="arrow" d="M945 321 H995"/>
  <path class="arrow" d="M945 465 C970 445 970 370 995 360"/>
  <path class="arrow dashed" d="M945 510 C970 530 975 515 995 510"/>
  <path class="arrow" d="M1075 387 V470"/>
  <path class="arrow" d="M1075 387 C1075 555 750 545 705 605"/>
  <path class="arrow" d="M705 626 H755"/>
  <path class="arrow" d="M755 605 C730 555 480 555 370 387"/>

  <text class="small" x="728" y="168" text-anchor="middle">Stage 1</text>
  <text class="small" x="728" y="304" text-anchor="middle">Stage 2</text>
  <text class="small" x="728" y="446" text-anchor="middle">Stage 3</text>
  <text class="small" x="965" y="456" text-anchor="middle">All fail</text>
</svg>